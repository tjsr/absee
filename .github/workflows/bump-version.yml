name: Bump version
run-name: Bump ${{ inputs.patchlevel }} version of absee

on:
  workflow_dispatch:
    inputs:
      patchlevel:
        description: Release level
        type: choice
        required: true
        default: prerelease
        options: [prerelease, patch, minor, major]
      prerelease-id:
        description: Prerelease identifier
        type: string
        required: false
        default: dev

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Update package and lockfile versions
        id: version
        env:
          PATCHLEVEL: ${{ inputs.patchlevel }}
          PREID: ${{ inputs.prerelease-id }}
        run: |
          npm version "$PATCHLEVEL" --no-git-tag-version --preid="$PREID"
          VERSION=$(node -p "require('./package.json').version")
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Open version-bump pull request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore: bump version to ${{ steps.version.outputs.value }}'
          title: 'chore: bump version to ${{ steps.version.outputs.value }}'
          body: 'Automated version bump requested from GitHub Actions.'
          branch: 'chore/bump-version-${{ steps.version.outputs.value }}'
          base: main

