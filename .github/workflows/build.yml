name: Build A/B See
run-name: ${{ github.actor }} Running A/B See build.
on: [push]
jobs:
  build-absee:
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILDKIT: 1
      BUILDKIT_PROGRESS: plain
      DBMIGRATE_IMAGE: tjsrowe/absee:dbmigrate-${{ github.sha }}
      API_IMAGE: tjsrowe/absee:${{ github.sha }}

    steps:
    - name: Check out repositofy code
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to Amazon ECR Public
      id: login-ecr-public
      if: ${{ github.actor != 'dependabot[bot]' }}
      uses: aws-actions/amazon-ecr-login@v2
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ECR_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_ECR_SECRET_ACCESS_KEY }}
        AWS_REGION: us-east-1
      with:
        registry-type: public

    - name: Build dbmigrate image
      uses: docker/build-push-action@v7
      with:
        context: .
        builder: ${{ steps.buildx.outputs.name }}
        secrets: |
          github=${{ secrets.GITHUB_TOKEN }}
        file: Dockerfile.dbmigrate
        push: ${{ github.actor != 'dependabot[bot]' }}
        tags: ${{ github.actor != 'dependabot[bot]' && format('{0}/', steps.login-ecr-public.outputs.registry) || ''}}${{ env.DBMIGRATE_IMAGE }}
        cache-from: type=gha
        cache-to: type=gha

  
    - name: Build API image
      uses: docker/build-push-action@v7
      with:
        context: .
        builder: ${{ steps.buildx.outputs.name }}
        secrets: |
          github=${{ secrets.GITHUB_TOKEN }}
        file: Dockerfile
        push: ${{ github.actor != 'dependabot[bot]' }}
        tags: ${{ github.actor != 'dependabot[bot]' && format('{0}/', steps.login-ecr-public.outputs.registry) || ''}}${{ env.API_IMAGE }}
        cache-from: type=gha
        cache-to: type=gha

  node-lts:
    name: Docker build (Node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          build-args: |
            NODE_VERSION=${{ matrix.node-version }}
            NODE_IMAGE=node:${{ matrix.node-version }}-alpine3.24
            NODE_RUNTIME_IMAGE=node:${{ matrix.node-version }}-alpine3.24
          secrets: |
            github=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha,scope=node-${{ matrix.node-version }}
          cache-to: type=gha,mode=max,scope=node-${{ matrix.node-version }}
