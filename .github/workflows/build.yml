name: Verify Cloudflare application
on:
  push:
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GOOGLE_CLIENT_ID: ci-placeholder
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@tjsr'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Test comparison result mapping
        run: npx vitest --run src/database/comparisonResults.test.ts
      - run: npm run build:client
      - name: Check Worker bundle
        run: npx wrangler deploy --dry-run --config wrangler.ci.jsonc

      - name: Install nested Worker dependencies without lifecycle scripts
        run: npm ci --prefix absee --ignore-scripts
      - name: Typecheck nested Worker
        run: npx tsc --noEmit --project absee/tsconfig.json
      - name: Test nested Worker schema migration
        run: node --experimental-strip-types --test absee/tests/security-upgrade.test.ts
      - name: Audit nested Worker dependencies
        run: npm audit --prefix absee --package-lock-only --ignore-scripts
      - name: Audit root dependency lockfile
        run: npm audit --package-lock-only --ignore-scripts
