name: Build A/B See
run-name: ${{ github.actor }} Running A/B See build.
on:
  push:
  pull_request:
permissions:
  contents: read
  packages: read

jobs:
  verify:
    name: Test and build without publishing
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - name: Check out repository code
      uses: actions/checkout@v7

    - name: Use Node.js 24
      uses: actions/setup-node@v7
      with:
        node-version: 24
        registry-url: 'https://npm.pkg.github.com'
        scope: '@tjsr'
        cache: npm

    - name: Use latest compatible npm
      run: npm install --global npm@latest --registry=https://registry.npmjs.org

    - name: Install locked dependencies
      run: npm ci --allow-git=root

    - name: Run tests
      run: npm test

    - name: Build
      run: npm run build

  build-absee:
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILDKIT: 1
      BUILDKIT_PROGRESS: plain
      DBMIGRATE_IMAGE: tjsrowe/absee:dbmigrate-${{ github.sha }}
      API_IMAGE: tjsrowe/absee:${{ github.sha }}

    steps:
    - name: Check out repositofy code
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to Amazon ECR Public
      id: login-ecr-public
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'tjsr/absee' && github.actor != 'dependabot[bot]' }}
      uses: aws-actions/amazon-ecr-login@v2
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ECR_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_ECR_SECRET_ACCESS_KEY }}
        AWS_REGION: us-east-1
      with:
        registry-type: public

    - name: Build dbmigrate image
      uses: docker/build-push-action@v7
      with:
        context: .
        builder: ${{ steps.buildx.outputs.name }}
        secrets: |
          github=${{ secrets.GITHUB_TOKEN }}
        file: Dockerfile.dbmigrate
        push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'tjsr/absee' && github.actor != 'dependabot[bot]' }}
        tags: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'tjsr/absee' && github.actor != 'dependabot[bot]' && format('{0}/', steps.login-ecr-public.outputs.registry) || ''}}${{ env.DBMIGRATE_IMAGE }}
        cache-from: type=gha
        cache-to: type=gha

    - name: Pull patched node image
      run: |
        docker pull ghcr.io/tjsr/node_patched_npm:20.18.1-alpine3.20-npm11.0.0
  
    - name: Build API image
      uses: docker/build-push-action@v7
      with:
        context: .
        builder: ${{ steps.buildx.outputs.name }}
        secrets: |
          github=${{ secrets.GITHUB_TOKEN }}
        file: Dockerfile
        push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'tjsr/absee' && github.actor != 'dependabot[bot]' }}
        tags: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'tjsr/absee' && github.actor != 'dependabot[bot]' && format('{0}/', steps.login-ecr-public.outputs.registry) || ''}}${{ env.API_IMAGE }}
        cache-from: type=gha
        cache-to: type=gha
