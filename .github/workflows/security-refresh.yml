name: Prepare security dependency lockfile
on:
  push:
    branches: [fix/security-dependencies-20261113]
    paths: [.github/workflows/security-refresh.yml]
permissions:
  contents: write
  packages: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/security-dependencies-20261113
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@tjsr'
      - name: Refresh compatible dependency versions without lifecycle scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm update --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Audit refreshed lockfile
        run: npm audit --package-lock-only --ignore-scripts --json > audit.json || test "$?" -eq 1
      - name: Commit lockfile only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'fix: refresh vulnerable dependency resolutions'
            git push origin HEAD:fix/security-dependencies-20261113
          fi
      - name: Summarize remaining advisories
        run: |
          node -e 'const a=require("./audit.json"); console.log(JSON.stringify(a.metadata)); for (const [n,v] of Object.entries(a.vulnerabilities||{})) console.log(n, v.severity, v.via.filter(x=>typeof x==="object").map(x=>x.url+" "+x.range).join("; "));'
